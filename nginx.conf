# Nginx configuration for NASRally web app
# Place this in /etc/nginx/conf.d/default.conf or include from main nginx.conf

server {
    listen 8089;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api-nas-rally.mayflower-paradise.us wss://api-nas-rally.mayflower-paradise.us;" always;

    # Cache control for static assets - versioned files get long cache, HTML gets no cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        # Check if file has hash in name (versioned) - cache for 1 year
        if ($request_filename ~* "\.[a-f0-9]{8,}\.") {
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }
        # Non-versioned static files - cache for 1 day
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        try_files $uri =404;
    }

    # HTML files - no cache, always revalidate
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Main index.html - no cache for SPA routing
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # SPA fallback - serve index.html for all non-asset routes
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json application/wasm;

    # Brotli compression (if module available)
    # brotli on;
    # brotli_vary on;
    # brotli_min_length 1024;
    # brotli_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json application/wasm;
}
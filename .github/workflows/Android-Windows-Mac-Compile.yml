name: Build and Release Apps

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'shared/**'
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows-installer
            artifact-path: "**/build/compose/binaries/main/msi/*.msi"
          - os: macos-latest
            artifact-name: macos-dmg
            artifact-path: "**/build/compose/binaries/main/dmg/*.dmg"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Gradle Package (Windows)
        if: matrix.os == 'windows-latest'
        run: .\gradlew.bat packageDistributionForCurrentOS

      - name: Run Gradle Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x ./gradlew
          ./gradlew packageDistributionForCurrentOS

      - name: Upload Intermediary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Intermediary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Compiled Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-artifacts

      - name: Download Compiled macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release-artifacts

      - name: Download Compiled Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-artifacts

      - name: Create Nightly Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Get current date
          DATE=$(date +'%Y-%m-%d')
          
          # Count existing releases for today to determine the build number
          COUNT=$(gh release list --limit 1000 | grep -c "nightly-$DATE" || true)
          BUILD_NUM=$((COUNT + 1))
          
          TAG="nightly-$DATE-$BUILD_NUM"
          TITLE="$DATE - Build$BUILD_NUM"

          # Create a new unique release
          gh release create "$TAG" \
            --repo "$GH_REPO" \
            --title "$TITLE" \
            --prerelease \
            --notes "Automated nightly build generated from the latest commit on the \`main\` branch. Commit: ${{ github.sha }}"

          # Upload artifacts to the new release
          find release-artifacts -type f -print0 | while IFS= read -r -d '' file; do
            gh release upload "$TAG" "$file" --repo "$GH_REPO"
          done

      - name: Create Official Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true

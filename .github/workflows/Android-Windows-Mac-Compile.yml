name: Build and Release Apps

on:
  push:
    branches: [ "main" ]
    paths:
      - 'shared/**'
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows-installer
            artifact-path: "**/build/compose/binaries/main/msi/*.msi"
          - os: macos-latest
            artifact-name: macos-dmg
            artifact-path: "**/build/compose/binaries/main/dmg/*.dmg"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Gradle Package (Windows)
        if: matrix.os == 'windows-latest'
        run: .\gradlew.bat packageDistributionForCurrentOS

      - name: Run Gradle Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x ./gradlew
          ./gradlew packageDistributionForCurrentOS

      - name: Upload Intermediary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload Intermediary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Compiled Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-artifacts

      - name: Download Compiled macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release-artifacts

      - name: Download Compiled Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-artifacts

      - name: Create or Update Nightly Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --title "Nightly Build" \
              --prerelease
          else
            gh release create nightly \
              --title "Nightly Build" \
              --prerelease \
              --notes "This is an automated nightly build generated from the latest commit on the main branch."
          fi

          find release-artifacts -type f -print0 |
            xargs -0 gh release upload nightly --clobber

          gh release edit nightly --notes "$(cat <<EOF
          This is an automated nightly build generated from the latest commit on the \`main\` branch.

          **Last Updated:** ${{ github.event.head_commit.timestamp }}
          **Commit:** ${{ github.sha }}
          EOF
          )"

      - name: Create Official Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true

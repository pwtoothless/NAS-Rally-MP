name: Build and Release Desktop App

on:
  push:
    branches: [ "main" ]
    paths:
      - 'shared/**'
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows-installer
            artifact-path: "**/build/compose/binaries/main/msi/*.msi"
          - os: macos-latest
            artifact-name: macos-dmg
            artifact-path: "**/build/compose/binaries/main/dmg/*.dmg"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Gradle Package (Windows)
        if: matrix.os == 'windows-latest'
        run: .\gradlew.bat packageDistributionForCurrentOS

      - name: Run Gradle Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x ./gradlew
          ./gradlew packageDistributionForCurrentOS

      - name: Upload Intermediary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to read existing tags

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      # Step A1: Calculate Date & Version Suffix for Nightly Build
      - name: Generate Nightly Tag and Name
        if: github.ref == 'refs/heads/main'
        id: nightly_meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          
          # Find all existing tags matching nightly-YYYY-MM-DD*
          MATCHING_TAGS=$(gh tag list --limit 1000 | grep "^nightly-${TODAY}" || true)

          if [ -z "$MATCHING_TAGS" ]; then
            # First build of the day
            TAG="nightly-${TODAY}"
            NAME="Nightly Build - ${TODAY}"
          else
            # Count existing builds and increment
            COUNT=$(echo "$MATCHING_TAGS" | wc -l)
            VERSION=$((COUNT + 1))
            TAG="nightly-${TODAY}-v${VERSION}"
            NAME="Nightly Build - ${TODAY} Ver. ${VERSION}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      # Step A2: Create the Versioned Nightly Release
      - name: Create Nightly Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.nightly_meta.outputs.name }}
          tag_name: ${{ steps.nightly_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: release-artifacts/*
          body: |
            Automated build from `main` branch.
            **Commit:** ${{ github.sha }}

      # Step B: Handle Versioned Production Build (Unchanged)
      - name: Create Official Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true

name: Build Desktop Cross-Platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows-installer
            artifact-path: "**/build/compose/binaries/main/msi/*.msi" # Default Compose MSI installer (can include EXE)
          - os: macos-latest
            artifact-name: macos-dmg
            artifact-path: "**/build/compose/binaries/main/dmg/*.dmg"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Windows-specific execution step
    - name: Run Gradle Package (Windows)
      if: matrix.os == 'windows-latest'
      run: .\gradlew.bat packageDistributionForCurrentOS

    # macOS-specific execution step
    - name: Run Gradle Package (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x ./gradlew
        ./gradlew packageDistributionForCurrentOS

    - name: Upload Native Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: ${{ matrix.artifact-path }}
